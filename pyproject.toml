[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skeleton-action"
version = "0.1.0"
description = "Skeleton-based action recognition on KARD with real-time Xbox 360 Kinect v1 inference"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT (code); KARD data is CC BY 4.0 and not included" }
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
viz = ["opencv-python>=4.8"]
dev = ["pytest>=7.4", "ruff>=0.5", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["requires_data: test needs the extracted KARD dataset (skipped otherwise)"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# notebook cell sources are embedded as strings
"scripts/build_notebooks.py" = ["E501"]
